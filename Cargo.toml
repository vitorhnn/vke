[package]
name = "vke"
version = "0.1.0"
authors = ["Victor Hermann Chiletto <victor.vasconceloschiletto@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ash = "0.37"
sdl2 = "0.36"
memoffset = "0.9"
glam = { version = "0.28", features = ["bytemuck", "serde"] }
png = "0.17"
parking_lot = "0.12"
smallvec = "1"
gpu-allocator = "0.25"
gltf = { version = "1", features = ["KHR_lights_punctual"]}
snafu = "0.8"
itertools = "0.12"
serde = { version = "1", features = ["derive"] }
shaderc = "0.8"
serde_json = "1.0"
spirv_cross = { git = "https://github.com/vitorhnn/spirv_cross.git", features = ["glsl"] }
bitflags = { version = "2.0.0-rc.1", features = ["serde"] }
ron = "0.8.0"
image = { version = "0.25.1", features = ["png"] }
bytemuck = { version = "1", features = ["derive"] }

#[profile.dev]
#opt-level=1
